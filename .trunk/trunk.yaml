# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  enabled:
    - shellcheck@0.11.0
    - shfmt@3.13.1
    - actionlint@1.7.12
    - checkov@3.3.13
    - git-diff-check
    - markdownlint@0.49.1
    - prettier@3.9.6
    - trivy@0.74.0
    - trufflehog@3.97.0
    - yamllint@1.38.0
  ignore:
    - linters:
        - markdownlint
      paths:
        - .github/**
        - CHANGELOG.md
        - LICENSE.md
        - .changes/**
actions:
  definitions:
    # The full CI mirror runs before anything leaves the machine; CI's job
    # is to double-check, not to discover.
    - id: verify-pre-push
      display_name: verify
      description: brew style and audit before push
      run: task verify
      triggers:
        - git_hooks: [pre-push]
  enabled:
    - commitlint
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
    - verify-pre-push
