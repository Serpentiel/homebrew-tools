version: "3"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  lint:
    desc: Run all linters via trunk
    cmds:
      - trunk check {{.CLI_ARGS}}

  bump:
    desc: Open PRs bumping the formula and cask to a release version (expects VERSION)
    cmds:
      - ./scripts/bump.sh "$VERSION"

  fmt:
    desc: Format the repository via trunk
    cmds:
      - trunk fmt {{.CLI_ARGS}}

  style:
    desc: Check formula and cask style with brew
    cmds:
      - |
        files=$(git ls-files 'Formula/*.rb' 'Casks/*.rb')
        if [ -n "$files" ]; then
          brew style $files
        else
          echo "no formulae or casks to check"
        fi

  audit:
    desc: Audit the formula and cask with brew (the tap must resolve to this checkout)
    cmds:
      - |
        tokens=$(git ls-files 'Formula/*.rb' 'Casks/*.rb' | sed -E 's#.*/(.+)\.rb$#serpentiel/tools/\1#')
        if [ -n "$tokens" ]; then
          brew audit --strict $tokens
        else
          echo "no formulae or casks to audit"
        fi

  verify:
    desc: The full CI mirror — style and audit
    cmds:
      - task: style
      - task: audit

  changelog:new:
    desc: Add a new changelog fragment
    cmds:
      - changie new

  changelog:verify:
    desc: Verify a changie fragment was added on this branch (expects BASE_REF)
    cmds:
      - |
        git fetch --no-tags --depth=1 origin "$BASE_REF"
        if git diff --name-only --diff-filter=A "origin/$BASE_REF...HEAD" -- '.changes/unreleased/*.yaml' | grep -q .; then
          echo "Changelog entry found."
        else
          echo "::error::No changelog entry found. Run 'task changelog:new' to add one, or apply the 'no changelog' label."
          exit 1
        fi

  changelog:batch:
    desc: Batch and merge the changelog for a release (expects VERSION)
    cmds:
      - changie batch "$VERSION"
      - changie merge

  release:normalize-tag:
    desc: Normalize and validate a release tag (expects TAG_INPUT), printing the v-prefixed tag
    silent: true
    cmds:
      - |
        tag="v${TAG_INPUT#[vV]}"
        if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$'; then
          echo "::error::'$TAG_INPUT' is not a valid semantic version" >&2
          exit 1
        fi
        printf '%s\n' "$tag"

  release:publish:
    desc: Commit the batched changelog, then create and push the release tag (expects TAG, BRANCH)
    cmds:
      - |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A .changes CHANGELOG.md
        git commit -m "chore(release): $TAG"
        git push origin "HEAD:$BRANCH"
        git tag -a "$TAG" -m "$TAG"
        git push origin "$TAG"

  release:github:
    desc: Create the GitHub release from the batched notes (expects TAG, VERSION, GH_TOKEN)
    cmds:
      - gh release create "$TAG" --title "$TAG" --notes-file ".changes/$VERSION.md"
