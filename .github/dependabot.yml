version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    # Minor and patch bumps arrive as one reviewable PR; majors stay
    # standalone so one breaking dependency cannot poison the batch.
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
