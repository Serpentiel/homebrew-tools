version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    # Every bump — majors included — arrives in one reviewable PR per
    # ecosystem; the ignore lists keep known-broken majors out of the batch.
    groups:
      actions-all:
        applies-to: version-updates
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
