name: Changelog

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Automated release-bump PRs (branch prefixed `bump-`, opened by the release
    # bot) only edit the formula/cask version and need no changelog entry.
    if: >
      !contains(github.event.pull_request.labels.*.name, 'skip workflows') &&
      !contains(github.event.pull_request.labels.*.name, 'no changelog') &&
      !contains(github.event.pull_request.labels.*.name, 'trunk') &&
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'bump-')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654
      - name: Require a changie fragment
        env:
          BASE_REF: ${{ github.base_ref }}
        run: task changelog:verify
