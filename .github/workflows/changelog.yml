name: Changelog

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Automated release-bump PRs (branch prefixed `bump-`, opened by the release
    # bot) only edit the formula/cask version and need no changelog entry.
    if: >
      !contains(github.event.pull_request.labels.*.name, 'skip workflows') &&
      !contains(github.event.pull_request.labels.*.name, 'no changelog') &&
      !contains(github.event.pull_request.labels.*.name, 'trunk') &&
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'bump-')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable
      - name: Install task
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.51.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Require a changie fragment
        env:
          BASE_REF: ${{ github.base_ref }}
        run: task changelog:verify
