name: Bump

# checkov:skip=CKV_GHA_7:the release version input is required to drive the bump
on:
  repository_dispatch:
    types:
      - betterglobekey-release
  workflow_dispatch:
    inputs:
      version:
        description: Release version, without leading v (e.g. 4.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: macos-latest
    timeout-minutes: 20
    environment: bump
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: app-token
        with:
          client-id: ${{ vars.BETTERGLOBEKEY_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.BETTERGLOBEKEY_RELEASE_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      - name: Open bump pull requests
        env:
          VERSION: ${{ github.event.inputs.version || github.event.client_payload.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: task bump
