name: Release

# checkov:skip=CKV_GHA_7:release tag input is required to drive the release flow
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, with or without leading v (e.g. 1.2.3 or v1.2.3)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    steps:
      - name: Mint release-bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.BETTERGLOBEKEY_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.BETTERGLOBEKEY_RELEASE_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - run: git fetch -f -t
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7
      - id: release
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          tag="$(task release:normalize-tag)"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag already exists" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Build changelog and tag release
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          task changelog:batch
          task release:publish
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: task release:github
